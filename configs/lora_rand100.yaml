# LoRA with random bbox jitter [0, 100] per training step.
# Low-rank adapters (r=8) on attention qkv layers. Encoder base weights frozen.

name: lora_seed0_rand100
method: lora
seed: 0

method_kwargs:
  rank: 8                  # ~24K LoRA params per block, 295K total
  alpha: 16                # alpha = 2*rank
  dropout: 0.0             # 0 for small datasets like ISIC

model:
  arch: vit_b
  checkpoint: checkpoints/medsam_vit_b.pth
  image_size: 1024

data:
  root: data
  bbox_perturb_pixels: 100  # upper bound of jitter range
  random_perturb: true      # sample jitter from [0, 100] per step

train:
  batch_size: 2            # A10 24 GB, encoder frozen, small LoRA backward
  num_workers: 2
  epochs: 6
  lr: 5.0e-4               # small param budget tolerates higher LR
  weight_decay: 0.0
  dice_weight: 0.5
  amp: true
  cooldown_seconds: 60

eval:
  batch_size: 2
  num_workers: 2

output:
  checkpoint_dir: checkpoints/runs_rand100
