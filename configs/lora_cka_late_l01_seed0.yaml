# LoRA + CKA regularization — auto-generated by cka/generate_cka_configs.py
# Position: late    Lambda: 0.1    Seed: 0
#
# Hooks applied to decoder layers: ['decoder_upscaling', 'decoder_iou_head', 'decoder_mask_logits']
# Per-layer weights inside the CKA loss: {'decoder_upscaling': 0.8, 'decoder_iou_head': 1.5, 'decoder_mask_logits': 1.0}

name: lora_cka_late_l01_seed0
method: lora
seed: 0

method_kwargs:
  rank: 8
  alpha: 16
  dropout: 0.0

model:
  arch: vit_b
  checkpoint: checkpoints/medsam_vit_b.pth
  image_size: 1024

data:
  root: data
  bbox_perturb_pixels: 0

train:
  batch_size: 1
  num_workers: 2
  epochs: 6
  lr: 5.0e-4
  weight_decay: 0.0
  dice_weight: 0.5
  amp: true
  cooldown_seconds: 60

eval:
  batch_size: 1
  num_workers: 2

cka_regularization:
  enabled: true
  lambda: 0.1
  probe_seed: 42
  n_isic: 12
  n_busi: 10
  n_cbis: 10
  encoder_chunk: 16              # micro-batch for probe encoder forward
  use_grad_checkpoint: true      # per-block checkpointing on the probe
                                 # encoder. Required at chunk_size >= 8 on
                                 # 22 GB A10 because SAM's 4 global-attention
                                 # blocks each materialise a ~6 GB tensor.
                                 # ~30% slower per probe forward but cuts
                                 # peak memory from ~25 GB to ~10 GB, letting
                                 # us use chunk=16 instead of chunk=4 — net
                                 # ~2× faster wall-clock per training step.
  hook_layers:
    - decoder_upscaling
    - decoder_iou_head
    - decoder_mask_logits
  weights:
    decoder_upscaling: 0.8
    decoder_iou_head: 1.5
    decoder_mask_logits: 1.0

output:
  checkpoint_dir: checkpoints/runs_cka_late
