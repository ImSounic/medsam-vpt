# Encoder-only LoRA with fixed bbox jitter at training time.

name: lora_encoder_only_r28_all_seed1_pm20
method: lora
seed: 1

method_kwargs:
  rank: 28
  alpha: 56
  dropout: 0.0
  train_mask_decoder: false
  target_modules: all

model:
  arch: vit_b
  checkpoint: checkpoints/medsam_vit_b.pth
  image_size: 1024

data:
  root: data
  bbox_perturb_pixels: 20

train:
  batch_size: 1
  num_workers: 2
  epochs: 6
  lr: 5.0e-4
  weight_decay: 0.0
  dice_weight: 0.5
  amp: true
  cooldown_seconds: 60

eval:
  batch_size: 1
  num_workers: 2

output:
  checkpoint_dir: checkpoints/runs_seed1_pm20
