# LoRA fine-tuning on MedSAM image encoder + trainable mask decoder.
# Low-rank adapters (r=8) on attention qkv layers. Encoder base weights frozen.

name: lora_seed1
method: lora
seed: 1

method_kwargs:
  rank: 8                  # ~24K LoRA params per block, 295K total
  alpha: 16                # alpha = 2*rank
  dropout: 0.0             # 0 for small datasets like ISIC

model:
  arch: vit_b
  checkpoint: checkpoints/medsam_vit_b.pth
  image_size: 1024

data:
  root: data
  bbox_perturb_pixels: 0

train:
  batch_size: 1            # fits 8 GB laptop and 16 GB T4/A16
  num_workers: 2
  epochs: 6                # ~6 epochs is enough, like VPT
  lr: 5.0e-4               # small param budget tolerates higher LR
  weight_decay: 0.0
  dice_weight: 0.5
  amp: true
  cooldown_seconds: 60     # thermal pause, harmless on Colab/cluster

eval:
  batch_size: 1
  num_workers: 2

output:
  checkpoint_dir: checkpoints/runs_seed1
