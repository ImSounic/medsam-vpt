# LoRA + CKA regularization — auto-generated by cka/generate_cka_configs.py
# Position: early    Lambda: 0.1    Seed: 0
#
# Hooks applied to decoder layers: ['decoder_transformer']
# Per-layer weights inside the CKA loss: {'decoder_transformer': 1.0}

name: lora_cka_early_l01_seed0
method: lora
seed: 0

method_kwargs:
  rank: 8
  alpha: 16
  dropout: 0.0

model:
  arch: vit_b
  checkpoint: checkpoints/medsam_vit_b.pth
  image_size: 1024

data:
  root: data
  bbox_perturb_pixels: 0

train:
  batch_size: 1
  num_workers: 2
  epochs: 6
  lr: 5.0e-4
  weight_decay: 0.0
  dice_weight: 0.5
  amp: true
  cooldown_seconds: 60

eval:
  batch_size: 1
  num_workers: 2

cka_regularization:
  enabled: true
  lambda: 0.1
  probe_seed: 42
  n_isic: 12
  n_busi: 10
  n_cbis: 10
  hook_layers:
    - decoder_transformer
  weights:
    decoder_transformer: 1.0

output:
  checkpoint_dir: checkpoints/runs_cka_early
