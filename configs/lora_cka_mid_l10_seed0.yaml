# LoRA + CKA regularization — auto-generated by cka/generate_cka_configs.py
# Position: mid    Lambda: 10.0    Seed: 0
#
# Hooks applied to decoder layers: ['decoder_transformer', 'decoder_upscaling']
# Per-layer weights inside the CKA loss: {'decoder_transformer': 1.0, 'decoder_upscaling': 0.8}

name: lora_cka_mid_l10_seed0
method: lora
seed: 0

method_kwargs:
  rank: 8
  alpha: 16
  dropout: 0.0

model:
  arch: vit_b
  checkpoint: checkpoints/medsam_vit_b.pth
  image_size: 1024

data:
  root: data
  bbox_perturb_pixels: 0

train:
  batch_size: 1
  num_workers: 2
  epochs: 6
  lr: 5.0e-4
  weight_decay: 0.0
  dice_weight: 0.5
  amp: true
  cooldown_seconds: 60

eval:
  batch_size: 1
  num_workers: 2

cka_regularization:
  enabled: true
  lambda: 10.0
  probe_seed: 42
  n_isic: 12
  n_busi: 10
  n_cbis: 10
  encoder_chunk: 16              # micro-batch for probe encoder forward
  use_grad_checkpoint: true      # per-block checkpointing on the probe encoder
  every_n_steps: 4               # compute CKA loss every N steps (lambda is
                                 # internally multiplied by N so cumulative
                                 # regularization is unchanged vs every-step).
                                 # 4 is a safe value — gives ~4x speedup
                                 # with negligible quality impact.
  hook_layers:
    - decoder_transformer
    - decoder_upscaling
  weights:
    decoder_transformer: 1.0
    decoder_upscaling: 0.8

output:
  checkpoint_dir: checkpoints/runs_cka_mid
