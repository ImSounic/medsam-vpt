
name: vpt_shallow_seed2_rand100
method: vpt_shallow
seed: 2

method_kwargs:
  n_prompts: 10
  gradient_checkpointing: true

model:
  arch: vit_b
  checkpoint: checkpoints/medsam_vit_b.pth
  image_size: 1024

data:
  root: data
  bbox_perturb_pixels: 100
  random_perturb: true

train:
  batch_size: 1
  num_workers: 2
  epochs: 6
  lr: 5.0e-4
  weight_decay: 0.0
  dice_weight: 0.5
  amp: true
  cooldown_seconds: 60

eval:
  batch_size: 1
  num_workers: 2

output:
  checkpoint_dir: checkpoints/runs_seed2_rand100
