# LoRA + CKA reg, auto-generated by cka/generate_cka_configs.py
# pos=mid lambda=1.0 seed=0
#

name: lora_cka_mid_l1_seed0
method: lora
seed: 0

method_kwargs:
  rank: 8
  alpha: 16
  dropout: 0.0

model:
  arch: vit_b
  checkpoint: checkpoints/medsam_vit_b.pth
  image_size: 1024

data:
  root: data
  bbox_perturb_pixels: 0

train:
  batch_size: 1
  num_workers: 8              # bumped from 2 to keep the GPU fed (CPU-bound decode/resize)
  epochs: 6
  lr: 5.0e-4
  weight_decay: 0.0
  dice_weight: 0.5
  amp: true
  cooldown_seconds: 0         # 0; A10 datacenter box needs no thermal cooldown

eval:
  batch_size: 1
  num_workers: 4

cka_regularization:
  enabled: true
  lambda: 1.0
  probe_seed: 42
  n_isic: 12
  n_busi: 10
  n_cbis: 10
  encoder_chunk: 4               # micro-batch for probe encoder fwd; 4 fits in 22 GB A10
  use_grad_checkpoint: true      # per-block checkpointing on probe encoder
  every_n_steps: 4               # CKA loss every N steps; lambda scaled by N internally, ~4x speedup
  hook_layers:
    - decoder_transformer
    - decoder_upscaling
  weights:
    decoder_transformer: 1.0
    decoder_upscaling: 0.8

output:
  checkpoint_dir: checkpoints/runs_cka_mid
