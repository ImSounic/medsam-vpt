# Adaptation-budget run (ACCV TrustFMI spec 5.1): decoder_only on 50 ISIC images,
# 6000 optimiser steps at batch 1, cosine over steps, val every 500 steps.

name: decoder_only_n50_seed1
method: decoder_only
seed: 1

model:
  arch: vit_b
  checkpoint: checkpoints/medsam_vit_b.pth
  image_size: 1024

data:
  root: data
  bbox_perturb_pixels: 0
  max_train_samples: 50
  subset_seed: 0

train:
  batch_size: 1
  num_workers: 8
  max_steps: 6000
  val_every_steps: 500
  lr: 1.0e-4
  weight_decay: 0.0
  dice_weight: 0.5
  amp: true
  cooldown_seconds: 0

eval:
  batch_size: 1
  num_workers: 4

output:
  checkpoint_dir: checkpoints/runs_accv_t6
