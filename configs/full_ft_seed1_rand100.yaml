
name: full_ft_seed1_rand100
method: full_ft
seed: 1

model:
  arch: vit_b
  checkpoint: checkpoints/medsam_vit_b.pth
  image_size: 1024

data:
  root: data
  bbox_perturb_pixels: 100
  random_perturb: true

train:
  batch_size: 1
  num_workers: 2
  epochs: 6
  lr: 1.0e-5
  weight_decay: 1.0e-4
  dice_weight: 0.5
  amp: true
  cooldown_seconds: 60

eval:
  batch_size: 1
  num_workers: 2

output:
  checkpoint_dir: checkpoints/runs_seed1_rand100
