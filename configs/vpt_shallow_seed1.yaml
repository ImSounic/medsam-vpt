# VPT-shallow: 10 prompts at encoder input + trainable mask decoder.
# Encoder weights frozen.

name: vpt_shallow_seed1
method: vpt_shallow
seed: 1

method_kwargs:
  n_prompts: 10            # 7,680 prompt + ~4M decoder params
  gradient_checkpointing: true   # needed for global attn at 4096 tokens, even on T4

model:
  arch: vit_b
  checkpoint: checkpoints/medsam_vit_b.pth
  image_size: 1024

data:
  root: data
  bbox_perturb_pixels: 0

train:
  batch_size: 1            # fits 8 GB laptop and 16 GB T4; use 2 only on >=24 GB
  num_workers: 2
  epochs: 6                # VPT converges faster than decoder-only
  lr: 5.0e-4               # higher LR than full FT, small param set
  weight_decay: 0.0
  dice_weight: 0.5
  amp: true
  cooldown_seconds: 60     # 60s pause before val for laptop GPUs, harmless on Colab

eval:
  batch_size: 1
  num_workers: 2

output:
  checkpoint_dir: checkpoints/runs_seed1
