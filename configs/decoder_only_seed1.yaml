
name: decoder_only_seed1
method: decoder_only
seed: 1

model:
  arch: vit_b
  checkpoint: checkpoints/medsam_vit_b.pth
  image_size: 1024

data:
  root: data
  bbox_perturb_pixels: 0

train:
  batch_size: 2
  num_workers: 2
  epochs: 10
  lr: 1.0e-4
  weight_decay: 0.0
  dice_weight: 0.5
  amp: true

eval:
  batch_size: 2
  num_workers: 2

output:
  checkpoint_dir: checkpoints/runs_seed1
