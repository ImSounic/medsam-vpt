# Full fine-tuning with bbox jitter at training time.
# Image encoder + mask decoder both trainable.
# Mirrors full_ft.yaml except for `bbox_perturb_pixels` and output paths.
# Memory-heavy. Designed to run on A16/T4 (16 GB) at batch=1.

name: full_ft_seed2_pm20
method: full_ft
seed: 2

model:
  arch: vit_b
  checkpoint: checkpoints/medsam_vit_b.pth
  image_size: 1024

data:
  root: data
  bbox_perturb_pixels: 20  # ±20 px jitter on each corner of the bbox per training step

train:
  batch_size: 1            # full FT at 1024px needs all of A16's 16 GB
  num_workers: 2
  epochs: 6                # match other methods for fair comparison
  lr: 1.0e-5               # 50x lower than PEFT — full FT needs gentler updates
  weight_decay: 1.0e-4     # mild WD to prevent encoder drift
  dice_weight: 0.5
  amp: true
  cooldown_seconds: 60     # defensive thermal pause

eval:
  batch_size: 1
  num_workers: 2

output:
  checkpoint_dir: checkpoints/runs_seed2_pm20
